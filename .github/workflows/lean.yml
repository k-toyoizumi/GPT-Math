name: Lean formal verification
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Mathlib dependencies
        run: |
          ~/.elan/bin/lake update
          ~/.elan/bin/lake exe cache get
      - name: Build and check all proofs
        run: ~/.elan/bin/lake build XuGeneralAudit XuTheorem41Audit TypeIIReconstruction
      - name: Reject incomplete proofs and custom axioms
        run: |
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit|axiom)([^[:alnum:]_]|$)' XuGeneralAudit.lean XuTheorem41Audit.lean TypeIIReconstruction.lean; then
            echo "Incomplete proof or custom axiom detected"
            exit 1
          fi
